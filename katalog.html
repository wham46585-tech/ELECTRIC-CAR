<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog - EVolution Mobil Listrik</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigasi -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">EV<span>olution</span></a>
            <ul class="nav-menu">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="katalog.html" class="active">Katalog</a></li>
                <li><a href="index.html#booking" class="btn-nav">Booking Test Drive</a></li>
            </ul>
        </div>
    </nav>

    <!-- Header Katalog -->
    <section class="katalog-header">
        <div class="container">
            <h1>Katalog Mobil Listrik</h1>
            <p>Temukan mobil listrik impian Anda dari berbagai merek terkemuka</p>
        </div>
    </section>

    <!-- Filter Section -->
    <section class="filter-section">
        <div class="container">
            <div class="filter-bar">
                <div class="filter-group">
                    <label for="filterMerek">Merek:</label>
                    <select id="filterMerek">
                        <option value="semua">Semua Merek</option>
                        <option value="Tesla">Tesla</option>
                        <option value="Hyundai">Hyundai</option>
                        <option value="Wuling">Wuling</option>
                        <option value="BMW">BMW</option>
                        <option value="Nissan">Nissan</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="filterHarga">Rentang Harga:</label>
                    <select id="filterHarga">
                        <option value="semua">Semua Harga</option>
                        <option value="0-500">Di bawah Rp 500 Juta</option>
                        <option value="500-1000">Rp 500 Juta - Rp 1 Miliar</option>
                        <option value="1000-999999">Di atas Rp 1 Miliar</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- Grid Katalog -->
    <section class="katalog-grid">
        <div class="container">
            <div class="grid-produk" id="gridKatalog">
                <!-- Akan diisi oleh JavaScript -->
            </div>
            <div id="noResult" style="display: none; text-align: center; padding: 40px;">
                <p>Tidak ada mobil yang sesuai dengan filter yang dipilih.</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 EVolution - Mobil Listrik Indonesia. Semua hak dilindungi.</p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/katalog.js"></script>
</body>
</html>
